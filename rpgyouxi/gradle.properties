# Force Gradle daemon and fork/worker JVMs to use UTF-8 file encoding.
# This prevents ClassNotFoundException or mangled path issues when Windows username or project paths contain Chinese characters (e.g. '黄', '开发计划').
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
org.gradle.java.home=E:/anzuo/jbr

